name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-validation:
    name: pr-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Validate installed dependency graph
        run: python -m pip check

      - name: Import application modules and direct dependencies
        run: |
          python - <<'PY'
          import importlib
          import pkgutil

          import real_estate_intel

          for dependency in ("folium", "numpy", "streamlit_folium"):
              importlib.import_module(dependency)

          modules = sorted(
              module.name
              for module in pkgutil.walk_packages(
                  real_estate_intel.__path__,
                  prefix=f"{real_estate_intel.__name__}.",
              )
          )
          for module in modules:
              importlib.import_module(module)
          print(f"application_imports=ok ({len(modules)} package modules)")
          PY

      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run full test suite
        run: python -m pytest -q -p no:cacheprovider

      - name: Run metric and data governance tests when present
        shell: bash
        run: |
          if [[ -f tests/test_metric_governance.py ]]; then
            python -m pytest -q -p no:cacheprovider tests/test_metric_governance.py
          else
            echo "metric_governance_tests=not_present_on_this_ref"
          fi

      - name: Validate committed CSV and SQLite parity
        run: python scripts/validate_committed_data_parity.py

      - name: Run release validator
        run: python scripts/validate_release.py

      - name: Confirm validation did not modify governed data
        run: git diff --exit-code -- data/processed data/warehouse

      - name: Publish validation summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            result="PASS"
          else
            result="FAIL"
          fi
          {
            echo "## Qareena PR validation: ${result}"
            echo
            echo "- Job: \`pr-validation\`"
            echo "- Python: 3.12"
            echo "- Production secrets: not requested"
            echo "- DATABASE_URL: intentionally empty"
            echo "- Data refresh and Supabase update: not executed"
          } >> "$GITHUB_STEP_SUMMARY"
