[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-intel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "plotly>=6.0",
    "requests>=2.32",
    "streamlit>=1.30",
    "folium>=0.17",
    "streamlit-folium>=0.22",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "reportlab>=4.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["real_estate_intel"]
package-dir = {"" = "src"}
